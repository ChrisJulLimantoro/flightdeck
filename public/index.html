<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <div class="brand">
    <h1>FLIGHT<span>DECK</span></h1>
    <button class="sub" id="viewer" title="Switch GitHub account">—</button>
  </div>

  <div class="strip" id="strip">
    <span class="strip-label">LIVE SESSIONS — CLICK TO OPEN</span>
    <div class="chips" id="chips"></div>
  </div>

  <div class="engine" role="group" aria-label="Engine">
    <button class="engine-btn is-active" data-engine="claude">CLAUDE</button>
    <button class="engine-btn" data-engine="codex">CODEX</button>
  </div>
  <div class="rule"></div>
</header>

<nav class="tabs">
  <button class="tab is-active" data-tab="mine">MINE <b id="count-mine">0</b></button>
  <button class="tab" data-tab="reviewed">REVIEWED BY ME <b id="count-reviewed">0</b></button>
  <span class="spacer"></span>
  <span class="meta" id="fetched">—</span>
  <button class="ghost" id="refresh">REFRESH</button>
</nav>

<main>
  <div class="banner" id="banner" hidden></div>
  <section class="board" id="board"></section>
</main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <span class="badge" id="drawer-engine">—</span>
    <span class="drawer-title" id="drawer-title">—</span>
    <span class="drawer-state" id="drawer-state">—</span>
    <span class="drawer-timer" id="drawer-timer"></span>
    <button class="ghost" id="drawer-handoff">HAND OFF</button>
    <button class="ghost" id="drawer-stop">STOP</button>
    <button class="ghost" id="drawer-close">CLOSE</button>
  </div>
  <div class="log" id="log"></div>
  <form class="reply" id="reply">
    <textarea id="reply-text" rows="1" placeholder="Reply to this session…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="solid" id="reply-send" type="submit">SEND</button>
  </form>
</aside>

<dialog class="modal" id="prompt-modal">
  <form method="dialog">
    <h2>RUN ON <span id="modal-repo">—</span></h2>
    <label>SKILL
      <select id="modal-skill"></select>
    </label>
    <label>PROMPT <small>(used when skill is “— free-form —”)</small>
      <textarea id="modal-prompt" rows="4" placeholder="Ask anything about this PR…"></textarea>
    </label>
    <label class="check"><input type="checkbox" id="modal-write"> ALLOW WRITES</label>
    <label class="check" id="modal-approvals-row">
      <input type="checkbox" id="modal-approvals"> ASK ME BEFORE EACH TOOL CALL
      <small id="modal-approvals-note"></small>
    </label>
    <label class="check" id="modal-unsandboxed-row" hidden><input type="checkbox" id="modal-unsandboxed"> RUN UNSANDBOXED</label>
    <p class="modal-note" id="modal-note"></p>
    <menu>
      <button value="cancel" class="ghost">CANCEL</button>
      <button value="run" id="modal-run" class="solid">RUN</button>
    </menu>
  </form>
</dialog>

<dialog class="modal" id="accounts-modal">
  <h2>GITHUB ACCOUNTS</h2>
  <div id="accounts-list"></div>
  <form id="account-add">
    <label>ADD A PERSONAL ACCESS TOKEN
      <input type="password" id="account-token" placeholder="ghp_…" autocomplete="off">
    </label>
    <p class="modal-note" id="accounts-note">
      Needs the <b>repo</b> scope. Create one at github.com/settings/tokens — classic tokens work; a
      fine-grained token may need org approval before it can see GDP-ADMIN repos.
    </p>
    <menu>
      <button type="button" class="ghost" id="accounts-close">CLOSE</button>
      <button type="submit" class="solid">ADD</button>
    </menu>
  </form>
</dialog>

<script src="/app.js" type="module"></script>
</body>
</html>
